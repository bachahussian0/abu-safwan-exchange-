<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abu Safwan - Riyal + PKR Hisaab</title>
<style>
:root{--g:#16a34a;--d:#0f172a}body{margin:0;background:var(--d);color:#fff;font-family:system-ui}header{padding:15px;text-align:center;background:#1e293b}h1{margin:0;font-size:20px}.card{background:#fff;color:#111;border-radius:14px;padding:15px;margin:12px}input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}.row{display:flex;gap:8px}.row>div{flex:1}button{padding:11px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}.btn-g{background:var(--g);color:#fff;width:100%;font-size:18px}.btn-s{background:#e2e8f0;margin:3px}.tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl th,.tbl td{border:1px solid #ddd;padding:5px;text-align:center}.paid{background:#dcfce7}.unpaid{background:#fee2e2}#lock{position:fixed;inset:0;background:var(--d);z-index:999;display:flex;align-items:center;justify-content:center}.lockbox{background:#fff;color:#111;padding:25px;border-radius:15px;width:85%;max-width:320px;text-align:center}
.box2{background:#f8fafc;border:1px dashed #94a3b8;padding:10px;border-radius:10px;margin:10px 0;text-align:center}
</style>
</head>
<body>
<div id="lock"><div class="lockbox"><h3>🔒 Abu Safwan</h3><input type="password" id="pw" placeholder="bacha0968023"><button class="btn-g" onclick="if(document.getElementById('pw').value==='bacha0968023'){document.getElementById('lock').style.display='none'}" style="margin-top:10px">داخل ہوں</button></div></div>
<header><h1>Abu Safwan Exchange</h1><small>ریال اور PKR دونوں کا حساب</small></header>

<div class="card">
<h3 style="margin:0 0 10px">➕ نیا اندراج</h3>
<label>کسٹمر نام</label><input id="cname" placeholder="باچا عالم">
<div class="row"><div><label>کل ریال / ڈالر</label><input type="number" id="totalCurr" oninput="calc()" placeholder="100"></div><div><label>کرنسی</label><select id="curr" onchange="calc()"><option>SAR - ریال</option><option>USD</option><option>AED</option></select></div></div>
<label>ریٹ</label><input type="number" id="rate" value="70" oninput="calc()">
<div class="box2">
<div class="row"><div><label>وصول (ریال میں)</label><input type="number" id="wasoolCurr" oninput="calc()" placeholder="50"></div><div><label>بقایا (ریال)</label><input id="baqayaCurr" readonly style="background:#fef3c7;font-weight:bold"></div></div>
</div>
<div class="box2" style="background:#f0fdf4;border-color:var(--g)">
<b>PKR حساب (خودکار)</b>
<div class="row"><div><small>کل رقم</small><input id="totalPKR" readonly style="font-weight:bold"></div><div><small>وصول PKR</small><input id="wasoolPKR" readonly></div></div>
<div style="margin-top:5px">بقایا PKR: <b id="baqayaPKR" style="color:red;font-size:18px">0</b></div>
<div id="status" style="margin-top:5px;font-weight:bold">⏳ باقی</div>
</div>
<button class="btn-g" onclick="save()">محفوظ کریں ✅</button>
</div>

<div class="card" style="overflow:auto"><table class="tbl"><thead><tr><th>نام</th><th>کل ریال</th><th>وصول ریال</th><th>بقایا ریال</th><th>ریٹ</th><th>کل PKR</th><th>وصول PKR</th><th>بقایا PKR</th><th>✏️/❌</th></tr></thead><tbody id="tbody"></tbody></table></div>

<script>
let data=JSON.parse(localStorage.getItem('abu_safwan_data_v2')||'[]');
function calc(){
 let tC=parseFloat(document.getElementById('totalCurr').value)||0;
 let wC=parseFloat(document.getElementById('wasoolCurr').value)||0;
 let rate=parseFloat(document.getElementById('rate').value)||0;
 let bC=tC-wC;
 document.getElementById('baqayaCurr').value=bC;
 let tP=tC*rate, wP=wC*rate, bP=bC*rate;
 document.getElementById('totalPKR').value=tP?tP.toFixed(0):'';
 document.getElementById('wasoolPKR').value=wP?wP.toFixed(0):'';
 document.getElementById('baqayaPKR').innerText=bP.toFixed(0)+' ہزار';
 document.getElementById('status').innerText=bP<=0?'✅ وصول':'⏳ باقی ہے';
 return {tC,wC,bC,rate,tP,wP,bP}
}
function save(){
 let c=calc(); let name=document.getElementById('cname').value||'نامعلوم';
 if(!c.tC){alert('کل ریال لکھیں');return}
 let e={id:Date.now(),name,curr:document.getElementById('curr').value.split(' ')[0],...c};
 data.unshift(e); localStorage.setItem('abu_safwan_data_v2',JSON.stringify(data)); render();
 document.getElementById('cname').value='';document.getElementById('totalCurr').value='';document.getElementById('wasoolCurr').value='';calc();
}
function render(){
 let tb=document.getElementById('tbody'); tb.innerHTML='';
 data.forEach(x=>{
  let tr=document.createElement('tr'); tr.className=x.bP<=0?'paid':'unpaid';
  tr.innerHTML=`<td>${x.name}</td><td>${x.tC} ${x.curr}</td><td style="color:green">${x.wC}</td><td style="color:red">${x.bC}</td><td>${x.rate}</td><td>${x.tP}</td><td>${x.wP}</td><td><b>${x.bP}</b></td><td><button onclick="data=data.filter(a=>a.id!==${x.id});localStorage.setItem('abu_safwan_data_v2',JSON.stringify(data));render()" style="background:#ef4444;color:#fff">❌</button></td>`;
  tb.appendChild(tr);
 })
}
render();
</script>
</body>
</html>
