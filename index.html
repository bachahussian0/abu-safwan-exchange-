<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abu Safwan Currency Exchange</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f5f4;
    color:#222;
}

header{
    background:#075e54;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    color:#075e54;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

input, select, button{
    width:100%;
    padding:12px;
    margin-top:6px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
}

button{
    background:#075e54;
    color:white;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.summary div{
    background:#fff;
    padding:15px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.summary strong{
    display:block;
    font-size:20px;
    margin-top:5px;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

th{
    background:#075e54;
    color:white;
}

.due{
    color:#c62828;
    font-weight:bold;
}

.paid{
    color:#16803c;
    font-weight:bold;
}

.delete{
    background:#c62828;
    padding:7px;
    font-size:13px;
}

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:20px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Abu Safwan Currency Exchange</h1>
    <p>کرنسی لین دین اور حساب</p>
</header>

<div class="container">

<!-- Summary -->

<div class="summary">

<div>
    کل حساب
    <strong id="totalAll">0 روپے</strong>
</div>

<div>
    کل وصول
    <strong id="totalReceived">0 روپے</strong>
</div>

<div>
    کل بقایا
    <strong id="totalDue">0 روپے</strong>
</div>

</div>

<br>

<!-- New Transaction -->

<div class="card">

<h2>نئی لین دین</h2>

<div class="grid">

<div>
<label>کسٹمر کا نام</label>
<input id="customer" type="text" placeholder="مثلاً محمد علی">
</div>

<div>
<label>موبائل نمبر</label>
<input id="phone" type="text" placeholder="03XXXXXXXXX">
</div>

<div>
<label>کرنسی</label>

<select id="currency">

<option value="ریال">سعودی ریال</option>
<option value="درہم">اماراتی درہم</option>
<option value="ڈالر">امریکی ڈالر</option>
<option value="یورو">یورو</option>

</select>

</div>

<div>
<label>رقم</label>
<input id="amount" type="number" step="0.01" placeholder="100">
</div>

<div>
<label>ریٹ</label>
<input id="rate" type="number" step="0.01" placeholder="75">
</div>

<div>
<label>وصول شدہ پاکستانی رقم</label>
<input id="received" type="number" step="0.01" value="0">
</div>

</div>

<br>

<button onclick="saveTransaction()">
حساب محفوظ کریں
</button>

</div>

<!-- Search -->

<div class="card">

<h2>کسٹمر تلاش کریں</h2>

<input
    id="search"
    type="text"
    placeholder="کسٹمر کا نام یا موبائل نمبر لکھیں"
    oninput="showTransactions()"
>

</div>

<!-- Records -->

<div class="card">

<h2>لین دین کا ریکارڈ</h2>

<div class="table-box">

<table>

<thead>

<tr>
<th>کسٹمر</th>
<th>موبائل</th>
<th>کرنسی</th>
<th>رقم</th>
<th>ریٹ</th>
<th>کل روپے</th>
<th>وصول</th>
<th>بقایا</th>
<th>تاریخ</th>
<th>حذف</th>
</tr>

</thead>

<tbody id="records"></tbody>

</table>

</div>

</div>

</div>


<script>

/*
    ریکارڈ LocalStorage میں محفوظ ہوگا۔
    Browser بند کرنے یا موبائل Restart کرنے سے
    عام طور پر ریکارڈ ختم نہیں ہوگا۔
*/

let transactions =
    JSON.parse(localStorage.getItem("abuSafwanTransactions")) || [];


/* حساب محفوظ کریں */

function saveTransaction(){

    let customer =
        document.getElementById("customer").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let currency =
        document.getElementById("currency").value;

    let amount =
        parseFloat(document.getElementById("amount").value);

    let rate =
        parseFloat(document.getElementById("rate").value);

    let received =
        parseFloat(document.getElementById("received").value) || 0;


    if(!customer){
        alert("کسٹمر کا نام لکھیں");
        return;
    }

    if(!amount || !rate){
        alert("رقم اور ریٹ درج کریں");
        return;
    }


    let total =
        amount * rate;

    let due =
        total - received;


    if(received > total){
        alert("وصول شدہ رقم کل رقم سے زیادہ نہیں ہو سکتی");
        return;
    }


    let transaction = {

        id: Date.now(),

        customer: customer,

        phone: phone,

        currency: currency,

        amount: amount,

        rate: rate,

        total: total,

        received: received,

        due: due,

        date: new Date().toLocaleString("ur-PK")

    };


    transactions.push(transaction);


    localStorage.setItem(
        "abuSafwanTransactions",
        JSON.stringify(transactions)
    );


    document.getElementById("customer").value="";
    document.getElementById("phone").value="";
    document.getElementById("amount").value="";
    document.getElementById("rate").value="";
    document.getElementById("received").value="0";


    showTransactions();

    alert("حساب محفوظ ہوگیا");
}


/* ریکارڈ دکھائیں */

function showTransactions(){

    let search =
        document.getElementById("search").value
        .toLowerCase();

    let records =
        document.getElementById("records");

    records.innerHTML="";


    let filtered =
        transactions.filter(t =>

            t.customer.toLowerCase().includes(search) ||

            t.phone.toLowerCase().includes(search)

        );


    filtered.reverse().forEach(t => {

        let row =
            document.createElement("tr");


        row.innerHTML = `

        <td>${t.customer}</td>

        <td>${t.phone}</td>

        <td>${t.currency}</td>

        <td>${format(t.amount)}</td>

        <td>${format(t.rate)}</td>

        <td>${format(t.total)} روپے</td>

        <td>${format(t.received)} روپے</td>

        <td class="${t.due > 0 ? 'due':'paid'}">

            ${format(t.due)} روپے

        </td>

        <td>${t.date}</td>

        <td>

            <button
                class="delete"
                onclick="deleteTransaction(${t.id})">

                حذف

            </button>

        </td>

        `;


        records.appendChild(row);

    });


    updateSummary();

}


/* حذف */

function deleteTransaction(id){

    if(!confirm("کیا آپ یہ حساب حذف کرنا چاہتے ہیں؟")){
        return;
    }


    transactions =
        transactions.filter(t => t.id !== id);


    localStorage.setItem(
        "abuSafwanTransactions",
        JSON.stringify(transactions)
    );


    showTransactions();

}


/* مجموعی حساب */

function updateSummary(){

    let total=0;

    let received=0;

    let due=0;


    transactions.forEach(t => {

        total += Number(t.total);

        received += Number(t.received);

        due += Number(t.due);

    });


    document.getElementById("totalAll").innerText =
        format(total)+" روپے";

    document.getElementById("totalReceived").innerText =
        format(received)+" روپے";

    document.getElementById("totalDue").innerText =
        format(due)+" روپے";

}


/* نمبر فارمیٹ */

function format(number){

    return Number(number).toLocaleString("en-US",{
        maximumFractionDigits:2
    });

}


/* صفحہ کھلتے ہی ریکارڈ */

showTransactions();

</script>

</body>
</html>
