<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abu Safwan - Final</title>
<style>
:root{--g:#16a34a;--d:#0f172a}body{margin:0;background:var(--d);color:#fff;font-family:system-ui}header{padding:12px;text-align:center;background:#1e293b;position:sticky;top:0;z-index:10}.card{background:#fff;color:#111;border-radius:14px;padding:14px;margin:10px}input,select{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:8px;font-size:15px;box-sizing:border-box}label{font-size:12px;font-weight:bold;color:#475569}.row{display:flex;gap:7px}.row>div{flex:1}button{padding:9px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.btn-g{background:var(--g);color:#fff;width:100%;font-size:17px;margin-top:8px}.tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl th,.tbl td{border:1px solid #ddd;padding:5px;text-align:center}.edit{background:#f59e0b;color:#fff}.del{background:#ef4444;color:#fff}
#lock{position:fixed;inset:0;background:var(--d);z-index:999;display:flex;align-items:center;justify-content:center}.lockbox{background:#fff;padding:22px;border-radius:15px;width:85%;max-width:300px;text-align:center;color:#111}
.alert{display:none;background:#fef9c3;border:2px solid #eab308;padding:8px;border-radius:8px;margin-bottom:8px;text-align:center;font-size:13px}
</style>
</head>
<body>
<div id="lock"><div class="lockbox"><h3>🔒 Abu Safwan</h3><input type="password" id="pw" placeholder="Password"><button class="btn-g" onclick="if(document.getElementById('pw').value==='bacha0968023'){document.getElementById('lock').style.display='none'}else{alert('غلط پاسورڈ')}">داخل ہوں</button></div></div>

<header><h1>Abu Safwan Currency Exchange</h1><small>مکمل اختیار والا کھاتہ</small></header>

<div class="card">
<div id="editBox" class="alert">✏️ آپ <b id="editName"></b> کا حساب ایڈٹ کر رہے ہیں <button onclick="cancelEdit()" style="background:#ef4444;color:#fff;padding:3px 8px;margin-right:10px">منسوخ</button></div>

<label>نام: باچا عالم</label><input id="cname" placeholder="نام لکھیں">

<div class="row"><div><label>کل ریال / ڈالر</label><input type="number" id="tR" placeholder="100" oninput="sync()"></div><div><label>کرنسی</label><select id="curr" onchange="sync()"><option>SAR - ریال</option><option>USD - ڈالر</option><option>AED - درہم</option><option>QAR</option></select></div></div>

<label>ریٹ</label><input type="number" id="rate" value="70" oninput="sync()">

<div style="background:#fffbeb;border:1px dashed #f59e0b;padding:8px;border-radius:10px;margin:8px 0">
<div class="row"><div><label>وصول (ریال میں) - آپ لکھیں</label><input type="number" id="wR" placeholder="مثال: 50" oninput="sync()"></div><div><label>بقایا (ریال)</label><input type="number" id="bR" placeholder="خود آئے گا" style="background:#fef3c7;font-weight:bold"></div></div>
</div>

<div style="background:#f0fdf4;border:1px dashed var(--g);padding:8px;border-radius:10px">
<b>PKR حساب - آپ کے اختیار میں</b>
<div class="row"><div><label>کل رقم PKR</label><input type="number" id="tP" placeholder="7000"></div><div><label>وصول PKR - آپ لکھیں</label><input type="number" id="wP" placeholder="5000" oninput="syncPKR()"></div></div>
<label>بقایا PKR</label><input type="number" id="bP" placeholder="2000" style="background:#fee2e2;font-weight:bold">
<div id="status" style="text-align:center;margin-top:5px;font-weight:bold;color:#16a34a"></div>
</div>

<button class="btn-g" id="saveBtn" onclick="save()">محفوظ کریں ✅</button>
</div>

<div class="card" style="overflow:auto">
<table class="tbl"><thead><tr><th>نام</th><th>کل ریال</th><th>وصول ریال</th><th>بقایا ریال</th><th>ریٹ</th><th>کل PKR</th><th>وصول PKR</th><th>بقایا PKR</th><th>✏️</th><th>❌</th></tr></thead><tbody id="tbody"></tbody></table>
<p style="font-size:11px;color:#666;text-align:center">✏️ پر کلک کریں تو حساب اوپر آ جائے گا، بدل کر دوبارہ محفوظ کریں</p>
</div>

<script>
let data = JSON.parse(localStorage.getItem('abu_final_v4')||'[]');
let editId = null;

// پرانی ڈیٹا کو بھی نئے سسٹم میں لانا
let old = JSON.parse(localStorage.getItem('abu_final')||'[]');
if(old.length && data.length===0){ data=old; localStorage.setItem('abu_final_v4',JSON.stringify(data)); }

function sync(){
 let tR = parseFloat(document.getElementById('tR').value)||0;
 let wR = parseFloat(document.getElementById('wR').value)||0;
 let rate = parseFloat(document.getElementById('rate').value)||0;

 let bR = tR - wR;
 document.getElementById('bR').value = tR? bR : '';

 if(tR && rate) document.getElementById('tP').value = tR * rate;
 if(tR && rate && wR) document.getElementById('wP').value = wR * rate;

 syncPKR();
}
function syncPKR(){
 let tP = parseFloat(document.getElementById('tP').value)||0;
 let wP = parseFloat(document.getElementById('wP').value)||0;
 if(tP) document.getElementById('bP').value = tP - wP;
 let bP = parseFloat(document.getElementById('bP').value)||0;
 document.getElementById('status').innerText = (tP && bP<=0)? '✅ وصول مکمل' : (tP? 'بقایا PKR: ' + bP + ' ہزار' : '');
}

function save(){
 let tR_el=document.getElementById('tR');
 if(!tR_el.value){alert('کل ریال لکھیں');return}
 let obj={
  id: editId || Date.now(),
  name: document.getElementById('cname').value||'نامعلوم',
  curr: document.getElementById('curr').value.split(' ')[0],
  tR: document.getElementById('tR').value,
  wR: document.getElementById('wR').value||0,
  bR: document.getElementById('bR').value||0,
  rate: document.getElementById('rate').value,
  tP: document.getElementById('tP').value,
  wP: document.getElementById('wP').value||0,
  bP: document.getElementById('bP').value||0
 };
 if(editId){
  data = data.map(x=> x.id===editId? obj : x);
 }else{
  data.unshift(obj);
 }
 localStorage.setItem('abu_final_v4',JSON.stringify(data));
 cancelEdit(); render();
}

function render(){
 let tb=document.getElementById('tbody'); tb.innerHTML='';
 data.forEach(x=>{
  tb.innerHTML+=`<tr>
  <td>${x.name}</td>
  <td>${x.tR} ${x.curr}</td>
  <td style="background:#dcfce7">${x.wR}</td>
  <td style="background:#fee2e2;color:red">${x.bR}</td>
  <td>${x.rate}</td>
  <td>${x.tP}</td>
  <td style="background:#dcfce7">${x.wP}</td>
  <td style="background:#fee2e2"><b>${x.bP}</b></td>
  <td><button class="edit" onclick="startEdit(${x.id})">✏️</button></td>
  <td><button class="del" onclick="del(${x.id})">❌</button></td>
  </tr>`;
 });
}
function startEdit(id){
 let x=data.find(a=>a.id===id);
 if(!x) return;
 editId=id;
 document.getElementById('cname').value=x.name;
 document.getElementById('tR').value=x.tR;
 document.getElementById('wR').value=x.wR;
 document.getElementById('bR').value=x.bR;
 document.getElementById('rate').value=x.rate;
 document.getElementById('tP').value=x.tP;
 document.getElementById('wP').value=x.wP;
 document.getElementById('bP').value=x.bP;
 document.getElementById('editBox').style.display='block';
 document.getElementById('editName').innerText=x.name;
 document.getElementById('saveBtn').innerText='اپڈیٹ کریں ✅';
 document.getElementById('saveBtn').style.background='#f59e0b';
 window.scrollTo({top:0,behavior:'smooth'});
}
function cancelEdit(){
 editId=null;
 document.getElementById('editBox').style.display='none';
 document.getElementById('saveBtn').innerText='محفوظ کریں ✅';
 document.getElementById('saveBtn').style.background='#16a34a';
 ['cname','tR','wR','bR','tP','wP','bP'].forEach(id=>document.getElementById(id).value='');
 document.getElementById('status').innerText='';
}
function del(id){ if(confirm('ڈیلیٹ کریں؟')){ data=data.filter(x=>x.id!==id); localStorage.setItem('abu_final_v4',JSON.stringify(data)); render(); } }

render();
</script>
</body>
</html>
